name: Deploy_CD

on:
  repository_dispatch:
    types: [deploy_frontend, deploy_backend, deploy_model]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Remove old containers
        run: docker rm -f robo-learn-ai-frontend robo-learn-ai-backend robo-learn-ai-model || true

      - name: Stop old containers
        run: docker compose down

      - name: Pull images
        run: docker compose pull

      - name: Start containers
        run: docker compose up -d
